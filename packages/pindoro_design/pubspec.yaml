name: pindoro_design
description: Pindoro design system - generated tokens, theme and widgets.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  pindoro_core: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
    - assets/mascot/
    - fonts/OFL.txt
  fonts:
    - family: FiraGO
      fonts:
        - asset: fonts/FiraGO-Regular.ttf
        - asset: fonts/FiraGO-Medium.ttf
          weight: 500
        - asset: fonts/FiraGO-SemiBold.ttf
          weight: 600
        - asset: fonts/FiraGO-Bold.ttf
          weight: 700
        - asset: fonts/FiraGO-ExtraBold.ttf
          weight: 800
        - asset: fonts/FiraGO-Heavy.ttf
          weight: 900
