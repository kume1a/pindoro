name: Deploy

# Runs the production stack from `prod` on the self-hosted runner on the home server
# (docs/deploy.md). Every run starts the stack, then fills in what is missing:
# - a push to prod deploys, then downloads the tiles and builds each city pack that isn't published;
# - on the 2nd of each month it rebuilds every city pack from fresh OSM data;
# - by hand (Run workflow) it rebuilds one city, all of them, or the tiles.
on:
  push:
    branches: [prod]
  schedule:
    - cron: "0 0 2 * *"
  workflow_dispatch:
    inputs:
      packs:
        description: "Packs to rebuild: missing, all, or a city id"
        default: missing
      tiles:
        description: Download the Georgia tiles again
        type: boolean
        default: false

# One run at a time, never cancelled midway: a killed `compose up` can leave the stack
# half-recreated, and pack builds share one database schema.
concurrency:
  group: production
  cancel-in-progress: false

env:
  DC: docker compose --env-file .env -f infra/docker-compose.prod.yml
  PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
  HTTP_PORT: ${{ vars.HTTP_PORT || '8100' }}

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      # Always the released code, also on the monthly run (schedules start from main).
      - uses: actions/checkout@v7
        with:
          ref: prod
          persist-credentials: false

      # Every repository variable becomes a line of .env, JSON-quoted with each `$` doubled so
      # compose reads it verbatim. Values are never echoed.
      - name: Write .env from repository variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          umask 077
          jq -r 'to_entries[] | "\(.key)=\((.value | gsub("[$]"; "$$")) | @json)"' \
            <<< "$VARS_JSON" > .env

      # Caddy reads its config only when it starts, so it restarts to pick up a changed Caddyfile.
      - name: Start the stack
        run: |
          $DC up -d --build
          $DC restart caddy

      # A deploy that leaves the API unreachable through the tunnel has to fail.
      - name: Wait for the API through the tunnel
        run: curl -fsS -m 10 --retry 30 --retry-delay 5 --retry-all-errors "https://$PUBLIC_HOST/health"

      - name: Tiles
        env:
          REFRESH: ${{ inputs.tiles }}
        run: |
          set -eu
          if [ "$REFRESH" = true ] || ! curl -fsS "http://127.0.0.1:$HTTP_PORT/tiles/catalog" | grep -q '"georgia"'; then
            $DC run --rm --build pipeline tiles
            $DC restart martin
          fi

      - name: Packs
        env:
          PACKS: ${{ github.event_name == 'schedule' && 'all' || inputs.packs || 'missing' }}
        run: |
          set -euo pipefail
          case "$PACKS" in
            missing | all) ;;
            *) [ -f "data/cities/$PACKS/city.yaml" ] || { echo "no city '$PACKS' in data/cities"; exit 1; } ;;
          esac
          for dir in data/cities/*/; do
            city=$(basename "$dir")
            case "$PACKS" in
              all | "$city") ;;
              missing) curl -fs -o /dev/null "http://127.0.0.1:$HTTP_PORT/packs/$city/manifest.json" && continue ;;
              *) continue ;;
            esac
            $DC run --rm --build pipeline fetch "$city"
            $DC run --rm pipeline build "$city"
            $DC run --rm pipeline validate "$city"
            $DC run --rm pipeline publish "$city"
          done

      - name: Show the stack
        if: failure()
        run: |
          $DC ps
          $DC logs --tail 100 api caddy

      # Each run rebuilds images; without this superseded layers fill the disk.
      - name: Prune superseded images
        if: always()
        run: docker image prune -f
