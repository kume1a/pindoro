name: mobile

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so goldens match; keep equal to `flutter_version` in the justfile.
  FLUTTER_VERSION: 3.47.9

jobs:
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: extractions/setup-just@v4
      - run: flutter pub get
      - run: just gen-check
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: just test-dart

  android:
    # The release APK friends sideload; without key.properties it is signed with the debug key.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: extractions/setup-just@v4
      - run: flutter pub get
      - run: just gen
      - run: flutter build apk --release
        working-directory: apps/mobile

  ios:
    # Unsigned build: proves the iOS side compiles; signing happens on a Mac (docs/deploy.md).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: extractions/setup-just@v4
      - run: flutter pub get
      - run: just gen
      - run: flutter build ios --release --no-codesign
        working-directory: apps/mobile
