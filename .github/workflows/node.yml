name: node

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    services:
      postgis:
        # Keep equal to infra/docker-compose*.yml so CI tests the PostGIS that runs in production.
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: pindoro
          POSTGRES_PASSWORD: pindoro
          POSTGRES_DB: pindoro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pindoro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: pindoro
      PGPASSWORD: pindoro
      PINDORO_REQUIRE_OSM_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install osmium-tool, osm2pgsql and psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool osm2pgsql postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: psql -d pindoro -c "CREATE DATABASE pindoro_test" -c "CREATE DATABASE pindoro_pipeline_test"
      - uses: extractions/setup-just@v4
      - run: pnpm exec biome ci .
      - run: pnpm -r typecheck
      - name: openapi.json and Drizzle migrations are up to date
        run: just api-check
      - name: Test @pindoro/geo (shared golden vectors)
        run: pnpm --filter @pindoro/geo test
      - name: Test @pindoro/api
        run: pnpm --filter @pindoro/api test
        env:
          TEST_DATABASE_URL: postgres://pindoro:pindoro@localhost:5432/pindoro_test
      - name: Test @pindoro/pipeline (synthetic OSM data only)
        run: pnpm --filter @pindoro/pipeline test
        env:
          TEST_DATABASE_URL: postgres://pindoro:pindoro@localhost:5432/pindoro_pipeline_test

  # What `just deploy` builds on the server, so a broken image fails here first.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/pipeline/Dockerfile .
      - name: Production compose file is valid
        run: docker compose --env-file .env.example -f infra/docker-compose.prod.yml config -q
        env:
          # .env.example leaves it empty, which `:?` rejects.
          CLOUDFLARE_TUNNEL_TOKEN: ci
