version: 2

# Monthly, one grouped PR per ecosystem.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: pub
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/pipeline]
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
