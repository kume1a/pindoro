# Production stack on the home server, run by .github/workflows/deploy.yml (docs/deploy.md).
# Only Caddy is published on the host (HTTP_PORT); the host's Cloudflare Tunnel routes PUBLIC_HOST
# to it. Every service sits on the internal-only default network; only Caddy (to
# publish its port) and one-off pipeline runs (which download OSM data and tiles) also join `egress`.
name: pindoro

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgis:5432/${POSTGRES_DB:?}

# Docker never rotates json-file logs on its own: cap each long-running service at 30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# The private Panoramax instance (profile `panoramax`, docs/deploy.md § 8). Its database sits on the
# internal network only.
x-panoramax-env: &panoramax-env
  DB_URL: postgres://panoramax:panoramax@panoramax-db/panoramax
  FS_URL: /data/panoramax
  FLASK_SECRET_KEY: ${PANORAMAX_SECRET_KEY:-}
  API_BLUR_URL: http://panoramax-blur:8000
  API_PICTURES_LICENSE_SPDX_ID: CC-BY-SA-4.0
  API_PICTURES_LICENSE_URL: https://creativecommons.org/licenses/by-sa/4.0/
  PICTURE_PROCESS_DERIVATES_STRATEGY: PREPROCESS

x-panoramax: &panoramax
  profiles: [panoramax]
  image: panoramax/api:2.17.0
  restart: unless-stopped
  logging: *logging
  environment: *panoramax-env
  volumes:
    - panoramax-pictures:/data/panoramax

services:
  postgis:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: pindoro-api
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: *database-url
      PACKS_DIR: /packs
      PACKS_PUBLIC_URL: https://${PUBLIC_HOST:?}/packs
      APP_BUILD: ${APP_BUILD:-0}
      APP_URL: ${APP_URL:-}
      LOG_LEVEL: info
    volumes:
      - packs:/packs:ro
    depends_on:
      postgis:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    logging: *logging
    command: ["/tiles"]
    volumes:
      - tiles:/tiles:ro

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    logging: *logging
    # Internal networks cannot publish ports.
    networks: [default, egress]
    ports:
      - "${HTTP_PORT:-8100}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - packs:/srv/packs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, martin]

  # Every night at 03:00 UTC: a pg_dump and a copy of each city's street ids into the backups
  # volume, keeping 14 days.
  backup:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          sleep $$(( (27 * 3600 - $$(date +%s) % 86400) % 86400 ))
          day=$$(date -u +%Y-%m-%d)
          pg_dump -Fc -f /backups/.in-progress && mv /backups/.in-progress "/backups/pindoro-$$day.dump" && echo "backup: $$day" || echo "backup: FAILED"
          for ids in /packs/*/identity.json; do
            [ -f "$$ids" ] && cp "$$ids" "/backups/$$(basename "$$(dirname "$$ids")")-identity-$$day.json"
          done
          find /backups -type f -mtime +14 -delete
          sleep 60
        done
    environment:
      PGHOST: postgis
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
    volumes:
      - backups:/backups
      - packs:/packs:ro
    depends_on:
      postgis:
        condition: service_healthy

  # The image carries data/ and the tokens; nothing is written back into the checkout.
  pipeline:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    image: pindoro-pipeline
    networks: [default, egress]
    environment:
      DATABASE_URL: *database-url
      PACKS_DIR: /packs
      # The live street ids sit next to each city's packs (packs/<city>/identity.json).
      IDENTITY_DIR: /packs
      # `pipeline photos`: a secret, and the private Panoramax (http://panoramax-api:5000) if any.
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
      PANORAMAX_URL: ${PANORAMAX_URL:-}
    volumes:
      - tiles:/repo/infra/tiles
      - packs:/packs
      - pipeline-cache:/repo/apps/pipeline/.cache
      - pipeline-out:/repo/apps/pipeline/out
    depends_on:
      postgis:
        condition: service_healthy

  # Our own 360° captures for decision junctions Mapillary lacks (SPEC §10), opt-in with
  # COMPOSE_PROFILES=panoramax. Faces and plates are blurred before a picture is stored; the API is
  # published on the server's loopback only, never through Caddy or the tunnel.
  panoramax-db:
    profiles: [panoramax]
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: panoramax
      POSTGRES_PASSWORD: panoramax
      POSTGRES_DB: panoramax
    volumes:
      - panoramax-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panoramax -d panoramax"]
      interval: 10s
      timeout: 5s
      retries: 10

  panoramax-migrations:
    <<: *panoramax
    command: db-upgrade
    restart: "no"
    volumes: []
    depends_on:
      panoramax-db:
        condition: service_healthy

  panoramax-api:
    <<: *panoramax
    command: api
    environment:
      <<: *panoramax-env
      # Pictures are processed by panoramax-worker, and uploads need the instance's token.
      PICTURE_PROCESS_THREADS_LIMIT: 0
      API_FORCE_AUTH_ON_UPLOAD: "true"
    # Internal networks cannot publish ports.
    networks: [default, egress]
    ports:
      - "127.0.0.1:${PANORAMAX_PORT:-5005}:5000"
    depends_on:
      panoramax-migrations:
        condition: service_completed_successfully

  panoramax-worker:
    <<: *panoramax
    command: picture-worker
    depends_on:
      panoramax-migrations:
        condition: service_completed_successfully
      panoramax-blur:
        condition: service_started

  # Blurs what panoramax-detect finds (faces, licence plates) in the JPEG itself.
  panoramax-blur:
    profiles: [panoramax]
    image: panoramax/sgblur:latest@sha256:d6080fb28650b1a63c6d533f865c6acb79a5db2ec82c279c01a7b3430641755f
    restart: unless-stopped
    logging: *logging
    environment:
      WEB_CONCURRENCY: "2"
      DETECT_URL: http://panoramax-detect:8001
    depends_on:
      panoramax-detect:
        condition: service_healthy

  # The detection model runs on the CPU: slow (seconds a picture) but enough for a few hundred
  # captures. With an NVIDIA GPU, add a `deploy.resources.reservations.devices` entry for it.
  panoramax-detect:
    profiles: [panoramax]
    image: panoramax/sgblur:latest@sha256:d6080fb28650b1a63c6d533f865c6acb79a5db2ec82c279c01a7b3430641755f
    restart: unless-stopped
    logging: *logging
    entrypoint: ["uvicorn", "src.detect.detect_api:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8001/').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  default:
    internal: true
  egress: {}

volumes:
  pgdata:
  packs:
  tiles:
  backups:
  caddy-data:
  caddy-config:
  pipeline-cache:
  pipeline-out:
  panoramax-db:
  panoramax-pictures:
