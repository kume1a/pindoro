# Production stack on the home server. Run from the repo root: just deploy
# Only Caddy is published on the host (HTTP_PORT); the host's Cloudflare Tunnel routes PUBLIC_HOST
# to it. Every service sits on the internal-only default network; only Caddy (to
# publish its port) and one-off pipeline runs (which download OSM data and tiles) also join `egress`.
name: pindoro

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgis:5432/${POSTGRES_DB:?}

# Docker never rotates json-file logs on its own: cap each long-running service at 30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgis:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: pindoro-api
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: *database-url
      PACKS_DIR: /packs
      PACKS_PUBLIC_URL: https://${PUBLIC_HOST:?}/packs
      APP_BUILD: ${APP_BUILD:-0}
      APP_URL: ${APP_URL:-}
      LOG_LEVEL: info
    volumes:
      - ${PACKS_DIR:-./packs}:/packs:ro
    depends_on:
      postgis:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    logging: *logging
    command: ["/tiles"]
    volumes:
      - ${TILES_DIR:-./tiles}:/tiles:ro

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    logging: *logging
    # Internal networks cannot publish ports.
    networks: [default, egress]
    ports:
      - "${HTTP_PORT:-8100}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PACKS_DIR:-./packs}:/srv/packs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, martin]

  # Nightly pg_dump at 03:00 UTC into infra/backups, keeping 14 days.
  backup:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          sleep $$(( (27 * 3600 - $$(date +%s) % 86400) % 86400 ))
          f=/backups/pindoro-$$(date -u +%Y-%m-%d).dump
          pg_dump -Fc -f /backups/.in-progress && mv /backups/.in-progress "$$f" && echo "backup: $$f" || echo "backup: FAILED"
          find /backups -name 'pindoro-*.dump' -mtime +14 -delete
          sleep 60
        done
    environment:
      PGHOST: postgis
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
    volumes:
      - ./backups:/backups
    depends_on:
      postgis:
        condition: service_healthy

  pipeline:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    image: pindoro-pipeline
    networks: [default, egress]
    environment:
      DATABASE_URL: *database-url
      PACKS_DIR: /packs
    volumes:
      - ../data:/repo/data
      - ../apps/mobile/assets:/repo/apps/mobile/assets
      - ../packages/pindoro_design/tokens:/repo/packages/pindoro_design/tokens:ro
      - ${TILES_DIR:-./tiles}:/repo/infra/tiles
      - ${PACKS_DIR:-./packs}:/packs
      - pipeline-cache:/repo/apps/pipeline/.cache
      - ../apps/pipeline/out:/repo/apps/pipeline/out
    depends_on:
      postgis:
        condition: service_healthy

networks:
  default:
    internal: true
  egress: {}

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  pipeline-cache:
