name: pindoro
description: Pindoro - learn a city's streets by dropping pins on an unlabelled map.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  http: ^1.6.0
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.6
  pindoro_core: any
  pindoro_design: any
  sqlite3: ^3.9.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
